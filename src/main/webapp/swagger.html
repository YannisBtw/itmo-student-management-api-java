<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Student Management API</title>

    <link
            rel="stylesheet"
            href="webjars/swagger-ui/5.34.0/swagger-ui.css"
    >
</head>

<body>

<div id="swagger-ui"></div>

<script src="webjars/swagger-ui/5.34.0/swagger-ui-bundle.js"></script>

<script>
    window.onload = function () {
        SwaggerUIBundle({
            url: "api/openapi.json",
            dom_id: "#swagger-ui",
            deepLinking: true,
            presets: [
                SwaggerUIBundle.presets.apis
            ],
            layout: "BaseLayout"
        });
    };
</script>

</body>
</html>
